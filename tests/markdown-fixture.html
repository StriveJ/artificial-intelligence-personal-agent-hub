<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AIPA Reading layout preview</title>
  <link rel="stylesheet" href="/style.css"><script type="module" src="/fixture.js"></script>
</head>
<body>
  <main>
    <header class="topbar"><div class="mobile-brand"><img src="/icon.svg" alt=""><strong>AIPA</strong></div><span class="topbar-label">Reading layout preview</span><div class="status-pill"><span class="online-dot"></span>Layout examples</div></header>
    <section class="chat-view"><div class="messages">
      <div class="message user"><div class="message-body">Help me review the work completed this week.</div></div>
      <div class="message assistant"><div class="answer-identity"><img src="/icon.svg" alt=""><span>AIPA</span></div><div id="example" class="message-content"></div></div>
      <details class="recall-coverage"><summary id="test-status">Validating</summary><ul id="test-results"></ul><label for="copy-check">Paste copied code</label><textarea id="copy-check" rows="3"></textarea></details>
    </div></section>
  </main>
</body>
</html>
